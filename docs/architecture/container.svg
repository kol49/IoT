<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#172b43"/></marker></defs><rect width="1600" height="1100" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="65" font-size="34" fill="#172b43" font-weight="bold" text-anchor="start">DesignSpace | C4 Level 2 — Containers</text><text x="65" y="104" font-size="20" fill="#52677d" font-weight="normal" text-anchor="start">Scope: applications and data store inside DesignSpace • Technologies are proposed choices</text><path d="M65 385 H665 V130 H1535 V945 H65 Z" fill="#f7faff" stroke="#607d9a" stroke-width="2" stroke-dasharray="10 7"/><text x="90" y="420" font-size="21" fill="#172b43" font-weight="bold" text-anchor="start">DesignSpace [Software System boundary]</text><rect x="80" y="165" width="370" height="160" rx="10" fill="#16365d"/><text x="265.0" y="204" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Designer</text><text x="265.0" y="237" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Person]</text><text x="265.0" y="277" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Sets preferences and reviews</text><text x="265.0" y="306" font-size="20" fill="white" font-weight="normal" text-anchor="middle">conditions for creative work.</text><rect x="715" y="155" width="500" height="190" rx="10" fill="#2468ac"/><text x="965.0" y="194" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Web Dashboard</text><text x="965.0" y="227" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Container: TypeScript / React]</text><text x="965.0" y="267" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Runs in the designer&#x27;s browser.</text><text x="965.0" y="296" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Shows readings, profiles, history,</text><text x="965.0" y="325" font-size="20" fill="white" font-weight="normal" text-anchor="middle">connectivity and in-app alerts.</text><polyline points="450,245 715,245" fill="none" stroke="#172b43" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="202" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">Uses dashboard</text><text x="580" y="230" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">[Browser UI]</text><rect x="105" y="505" width="440" height="245" rx="10" fill="#2468ac"/><text x="325.0" y="544" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Sensor Firmware</text><text x="325.0" y="577" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Container: C++ / ESP32]</text><text x="325.0" y="617" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Reads light, temperature and humidity</text><text x="325.0" y="646" font-size="20" fill="white" font-weight="normal" text-anchor="middle">from attached sensors via I2C.</text><text x="325.0" y="675" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Timestamps and submits readings</text><text x="325.0" y="704" font-size="20" fill="white" font-weight="normal" text-anchor="middle">every 30 seconds using a device</text><text x="325.0" y="733" font-size="20" fill="white" font-weight="normal" text-anchor="middle">credential; retries transient failures.</text><rect x="715" y="495" width="500" height="255" rx="10" fill="#2468ac"/><text x="965.0" y="534" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Backend API</text><text x="965.0" y="567" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Container: Python / FastAPI]</text><text x="965.0" y="607" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Authenticates users and paired devices.</text><text x="965.0" y="636" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Validates readings; manages profiles.</text><text x="965.0" y="665" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Evaluates sustained deviations;</text><text x="965.0" y="694" font-size="20" fill="white" font-weight="normal" text-anchor="middle">serves history and in-app alerts.</text><text x="965.0" y="723" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Computes freshness / offline status.</text><polyline points="545,620 715,620" fill="none" stroke="#172b43" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="535" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">Submits readings</text><text x="630" y="563" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">[HTTPS / JSON;</text><text x="630" y="591" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">device credential]</text><polyline points="965,345 965,495" fill="none" stroke="#172b43" stroke-width="3" marker-end="url(#arrow)"/><text x="1175" y="384" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">Pairs devices, updates profiles;</text><text x="1175" y="412" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">polls readings, status and alerts</text><text x="1175" y="440" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">[HTTPS / JSON; user session]</text><rect x="715" y="815" width="500" height="100" rx="10" fill="#2468ac"/><text x="965.0" y="854" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Workspace Database</text><text x="965.0" y="887" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Container: PostgreSQL]</text><polyline points="965,750 965,815" fill="none" stroke="#172b43" stroke-width="3" marker-end="url(#arrow)"/><text x="1255" y="775" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">Reads / writes workspace data</text><text x="1255" y="803" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">[SQL / TLS]</text><text x="350" y="813" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">Database stores users, device ownership,</text><text x="350" y="840" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">profiles, readings and alert state.</text><text x="350" y="867" font-size="18" fill="#172b43" font-weight="normal" text-anchor="middle">30-day reading retention; 24-hour UI history.</text><line x1="65" y1="985" x2="1535" y2="985" stroke="#cad7e4"/><text x="65" y="1022" font-size="18" fill="#172b43" font-weight="normal" text-anchor="start">Key: dark blue = person; blue = container; dashed outline = system boundary; arrows = labeled interactions.</text><text x="65" y="1060" font-size="18" fill="#52677d" font-weight="normal" text-anchor="start">DesignSpace | Proposed MVP architecture | Task #2 | Arrows show the direction of use or data submission.</text></g></svg>