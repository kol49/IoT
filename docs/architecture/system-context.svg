<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#172b43"/></marker></defs><rect width="1600" height="1100" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="65" font-size="34" fill="#172b43" font-weight="bold" text-anchor="start">DesignSpace | C4 Level 1 — System Context</text><text x="65" y="104" font-size="20" fill="#52677d" font-weight="normal" text-anchor="start">Scope: DesignSpace as a whole • Audience: designers, stakeholders and project reviewers</text><rect x="560" y="175" width="480" height="175" rx="10" fill="#16365d"/><text x="800.0" y="214" font-size="26" fill="white" font-weight="bold" text-anchor="middle">Designer</text><text x="800.0" y="247" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Person]</text><text x="800.0" y="287" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Owns one monitored workspace;</text><text x="800.0" y="316" font-size="20" fill="white" font-weight="normal" text-anchor="middle">sets preferences for creative activities.</text><polyline points="800,350 800,520" fill="none" stroke="#172b43" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="402" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">Pairs a sensor; selects profiles;</text><text x="460" y="430" font-size="19" fill="#172b43" font-weight="normal" text-anchor="middle">views conditions, history and alerts</text><rect x="460" y="530" width="680" height="230" rx="10" fill="#2468ac"/><text x="800.0" y="569" font-size="26" fill="white" font-weight="bold" text-anchor="middle">DesignSpace</text><text x="800.0" y="602" font-size="18" fill="#e2efff" font-weight="normal" text-anchor="middle">[Software System]</text><text x="800.0" y="642" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Monitors desk lighting, temperature and humidity.</text><text x="800.0" y="671" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Compares measurements with personal preferences</text><text x="800.0" y="700" font-size="20" fill="white" font-weight="normal" text-anchor="middle">and reports sustained deviations.</text><text x="800.0" y="729" font-size="20" fill="white" font-weight="normal" text-anchor="middle">Includes device firmware and the dashboard service.</text><text x="800" y="838" font-size="21" fill="#172b43" font-weight="normal" text-anchor="middle">Scope: one designer, one workspace, one sensor device.</text><text x="800" y="868" font-size="21" fill="#172b43" font-weight="normal" text-anchor="middle">No external software service is required by the proposed MVP.</text><text x="800" y="898" font-size="21" fill="#172b43" font-weight="normal" text-anchor="middle">Physical sensors are hardware inputs, not separate software systems.</text><line x1="65" y1="985" x2="1535" y2="985" stroke="#cad7e4"/><text x="65" y="1022" font-size="18" fill="#172b43" font-weight="normal" text-anchor="start">Key: dark blue = person; blue = software system in scope; solid arrow = labeled relationship.</text><text x="65" y="1060" font-size="18" fill="#52677d" font-weight="normal" text-anchor="start">DesignSpace | Proposed MVP architecture | Task #2 | Arrows show the direction of use or data submission.</text></g></svg>