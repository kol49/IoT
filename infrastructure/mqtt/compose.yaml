name: designspace-mqtt
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./config:/mosquitto/config:ro
      - ./secrets:/mosquitto/secrets:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/secrets/ca.crt -u health -P \"$$(cat /mosquitto/secrets/health-password)\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  client:
    profiles: [tools]
    build: ./client
    environment:
      MQTT_HOST: broker
    volumes:
      - ./secrets/ca.crt:/app/ca.crt:ro
      - ./secrets/clients.json:/app/clients.json:ro
    depends_on:
      broker:
        condition: service_healthy
volumes:
  broker-data:
